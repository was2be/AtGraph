<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>@Stat Privacy Policy</title>

  <meta
    name="description"
    content="@Stat Privacy Policy. Learn how @Stat does not use any personal information"
  >

  <link rel="canonical" href="https://atgraph.app/atstat/privacy">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #1d1d1f;
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 70px 24px;
    }

    header {
      text-align: center;
      padding-bottom: 50px;
    }

    .logo {
      width: 180px;
      max-width: 70%;
      height: auto;
      display: block;
      margin: 0 auto 30px auto;
      border-radius: 12.5%; 
      overflow: hidden; 
      box-shadow: 0 2px 6px rgba(0,0,0,.12)
    }

    h1 {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .updated {
      margin-top: 12px;
      color: #6e6e73;
      font-size: 16px;
    }

    main {
      font-size: 18px;
    }

    p {
      margin: 0 0 24px 0;
    }

    a {
      color: #0071e3;
    }

    .footer {
      margin-top: 80px;
      padding-top: 30px;
      border-top: 1px solid #e5e5e7;
      font-size: 14px;
      color: #888;
      text-align: center;
    }

    @media (max-width: 600px) {
      .container {
        padding: 50px 20px;
      }

      h1 {
        font-size: 34px;
      }

      main {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>

      <img
        class="logo"
        src="../@Stat_Logo.png"
        alt="@Graph logo"
      >

      <h1>@Stat Privacy Policy</h1>

      <p class="updated">
        Last updated: August 2026
      </p>

    </header>

    <main>

      <p>
        @Stat does not collect, transmit, or store personal information.
      </p>

      <p>
        For support:
        <a href="mailto:Support@atgraph.app">
          Support@atgraph.app
        </a>
      </p>

    </main>

    <footer class="footer">
      © 2026 AtGraph. All rights reserved.
    </footer>

  </div>

</body>
</html>
```
